name: flutter_zero_webcam_depth
description: >-
  Flutter Zero example: standalone macOS webcam capture with a Filament
  pass-through render and a stats HUD (design doc Phase 1, no depth model).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0-0

# Thermion's build hooks (archive / code_assets) conflict with the versions
# pinned in the flutter_zero workspace, so this example resolves its own
# dependency set instead of joining `workspace:`. Same reason as
# examples/thermion_basic.
#
# `mode: release` is required: thermion only publishes Linux prebuilt
# binaries in release mode, and macOS has both.
hooks:
  user_defines:
    thermion_dart:
      mode: release

dependencies:
  thermion_dart:
    git:
      url: https://github.com/nmfisher/thermion.git
      ref: develop
      path: thermion_dart
  sdl3: ^2.8.5
  vector_math: ^2.1.0
  ffi: ^2.2.0

  # Used by hook/build.dart. Declared directly rather than relying on
  # thermion_dart re-exporting them, since the hook is this package's own.
  code_assets: ^1.0.0
  hooks: ^1.0.0
  logging: ^1.2.0
  native_toolchain_c: ^0.17.6

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
